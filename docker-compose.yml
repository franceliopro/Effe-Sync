services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://botcontrol:${POSTGRES_PASSWORD}@db:5432/botcontrol
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EVOLUTION_URL: ${EVOLUTION_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      PORT: 3000
      NODE_ENV: production
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: botcontrol
      POSTGRES_USER: botcontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botcontrol -d botcontrol"]
      interval: 5s
      retries: 12
volumes:
  db_data:
